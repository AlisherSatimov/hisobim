      # Bu yerda faqat veb build o'tishi uchun kerak.
      VITE_SUPABASE_URL: https://ttgmhrrrrcmaaohwfwwo.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_NmhvXhWiKR01ejjP0Wn9dA_bI0HTTuq

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
